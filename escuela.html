<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Escuela Epolax Cristal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Concepto: la escuela es resina viva. Cada modulo tiene material, color y formato de leccion propios;
   la marca Epolax (noche + tipografia condensada) une el conjunto. */
:root {
  color-scheme: dark;
  --fondo: #080f1a; --pizarra: #0f1a2b; --placa: #16243a; --linea: #2a3a52;
  --texto: #eef2f7; --suave: #aab6c7; --acento: #f5a623; --acento2: #bfe0ee; --sobre: #16100a;
  --velo: 8, 15, 26; --rojo: #ff8f7f; --azul: #8cc4f2;
  --grad: linear-gradient(120deg, #0e4d6b, #080f1a 55%, #f5a623);
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --cuerpo: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --dato: "IBM Plex Mono", Consolas, monospace;
}
[data-mod="m1"] { --fondo: #06161f; --pizarra: #0b2431; --placa: #103344; --linea: #1f4c60; --texto: #e8fbff; --suave: #9fc6d2; --acento: #35e0e8; --acento2: #b5fff1; --sobre: #04222a; --velo: 6, 22, 31; --grad: linear-gradient(120deg, #06202e, #0fa3b1 60%, #b5fff1); }
[data-mod="m2"] { --fondo: #150a24; --pizarra: #221238; --placa: #301a4e; --linea: #4c2f70; --texto: #fbf0ff; --suave: #c9b3d9; --acento: #ff5fb2; --acento2: #ffd166; --sobre: #2b0420; --velo: 21, 10, 36; --grad: linear-gradient(120deg, #1a0a2e, #b5179e 60%, #ffd166); }
[data-mod="m3"] { --fondo: #052020; --pizarra: #0a3030; --placa: #0f4141; --linea: #1f5e5b; --texto: #f3fbf6; --suave: #a9cfc6; --acento: #e8c468; --acento2: #4fd6c8; --sobre: #1d1503; --velo: 5, 32, 32; --grad: linear-gradient(120deg, #052f2f, #0b8a83 55%, #e8c468); }
[data-mod="m4"] { --fondo: #1a0f07; --pizarra: #29180c; --placa: #392213; --linea: #5a3a22; --texto: #fbf2e8; --suave: #d3bca6; --acento: #2fd6cf; --acento2: #e09a54; --sobre: #042322; --velo: 26, 15, 7; --grad: linear-gradient(120deg, #2a1608, #8a4b1f 50%, #12b5b0); }
[data-mod="m5"] { color-scheme: light; --fondo: #eef1f4; --pizarra: #ffffff; --placa: #e2e7ed; --linea: #c6cfda; --texto: #131a24; --suave: #4d5868; --acento: #a97f1f; --acento2: #5d6878; --sobre: #ffffff; --velo: 238, 241, 244; --rojo: #b3372b; --azul: #2b6cb0; --grad: linear-gradient(120deg, #ffffff, #dfe5ea 55%, #c9a24b); }
[data-mod="m6"] { --fondo: #07170f; --pizarra: #0d2519; --placa: #133424; --linea: #245238; --texto: #f0fbf4; --suave: #a8cdb6; --acento: #4fe08f; --acento2: #f5c04a; --sobre: #05190e; --velo: 7, 23, 15; --grad: linear-gradient(120deg, #0b1f14, #1f7a4d 55%, #f5a623); }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: #080f1a; color: #eef2f7; font: 400 16px/1.6 var(--cuerpo); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: #080f1a; }
#app { background: var(--fondo); color: var(--texto); transition: background-color .3s ease; }
a { color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button, input { font: inherit; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
.ancho { max-width: 1180px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.cabecera { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: rgba(8, 15, 26, .96); border-bottom: 1px solid #2a3a52; }
.cabecera .ancho { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 66px; flex-wrap: wrap; padding-block: 8px; }
.marca { display: block; line-height: 0; }
.marca img { height: 34px; width: auto; }
nav { display: flex; flex-wrap: wrap; gap: 4px 20px; }
nav a { font-weight: 500; font-size: 15px; text-decoration: none; color: #aab6c7; padding: 6px 0; border-bottom: 2px solid transparent; }
nav a:hover { color: #fff; }
nav a[aria-current="page"] { color: #fff; border-color: #f5a623; }
.vista { padding-block: 44px 72px; }
.etiqueta { margin: 0; font: 500 13px/1.4 var(--dato); letter-spacing: .08em; text-transform: uppercase; color: var(--acento); }
.titulo { font: 900 clamp(64px, 13vw, 172px)/.86 var(--display); text-transform: uppercase; letter-spacing: -.01em; margin-top: 12px; }
.titulo.chico { font-size: clamp(54px, 9.5vw, 118px); }
.titulo em { font-style: normal; color: var(--acento); }
h2.sec { font: 800 clamp(38px, 5.6vw, 64px)/1 var(--display); text-transform: uppercase; }

.banda { position: relative; overflow: hidden; background-image: var(--grad); background-size: cover; background-position: center; isolation: isolate; }
.banda canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: -2; }
.velo { position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(var(--velo), .92) 0%, rgba(var(--velo), .68) 46%, rgba(var(--velo), .08) 100%); pointer-events: none; }
.banda .ancho { padding-block: clamp(56px, 9vw, 112px); }
.banda.modulo .ancho { padding-block: clamp(44px, 6vw, 76px); }
.bajada { font-size: clamp(18px, 2vw, 21px); max-width: 32em; margin: 20px 0 28px; }
.acciones { display: flex; flex-wrap: wrap; gap: 10px; }
.boton { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 9px 22px; border: 1px solid var(--acento); background: var(--acento); color: var(--sobre); font-weight: 700; text-decoration: none; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
.boton:hover { transform: translateY(-2px); box-shadow: 0 8px 0 -3px rgba(var(--velo), .9), 0 8px 0 -2px var(--acento); }
.boton.sec2 { background: transparent; color: var(--texto); border-color: var(--suave); }
.boton.sec2:hover { border-color: var(--acento); box-shadow: none; }
.boton:disabled { opacity: .4; cursor: default; transform: none; box-shadow: none; }

.ficha { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--linea); margin-bottom: 54px; }
.ficha div { padding: 6px 16px 22px 0; }
.ficha div + div { border-left: 1px solid var(--linea); padding-left: 16px; }
.ficha b { display: block; font: 800 clamp(32px, 4.8vw, 52px)/1 var(--display); color: var(--acento2); }
.ficha span { font-size: 14px; color: var(--suave); }

.mosaico { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 24px 0 56px; }
.tesela { position: relative; isolation: isolate; display: grid; align-content: end; gap: 3px; min-height: 290px; padding: 18px; text-decoration: none; overflow: hidden; background-image: var(--grad); background-size: cover; background-position: center; color: var(--texto); transition: transform .2s ease; }
.tesela::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(0deg, rgba(var(--velo), .94) 8%, rgba(var(--velo), .35) 58%, rgba(var(--velo), .02) 100%); }
.tesela:hover { transform: translateY(-5px); }
.tesela .cod { position: absolute; top: 8px; right: 14px; font: 900 70px/1 var(--display); color: var(--texto); opacity: .92; }
.tesela .fmt { font: 500 12px var(--dato); letter-spacing: .08em; text-transform: uppercase; color: var(--acento); }
.tesela h3 { font: 800 33px/1 var(--display); text-transform: uppercase; }
.tesela small { font: 500 14px var(--dato); }
.tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px; margin-top: 24px; }
.tres h3 { font: 800 28px/1.05 var(--display); text-transform: uppercase; margin-bottom: 8px; color: var(--acento); }
.tres p { margin: 0; color: var(--suave); }

.lista-mod { margin-top: 26px; display: grid; gap: 10px; }
.fila-mod { display: grid; grid-template-columns: 150px minmax(0, 1fr) 100px 110px auto; gap: 18px; align-items: center; background: var(--pizarra); padding-right: 16px; color: var(--texto); }
.fila-mod .cod { display: grid; place-items: center; min-height: 104px; font: 900 44px/1 var(--display); background-image: var(--grad); background-size: cover; background-position: center; color: var(--texto); text-shadow: 0 1px 8px rgba(var(--velo), .9); }
.fila-mod h3 { font: 800 28px/1.05 var(--display); text-transform: uppercase; }
.fila-mod p { margin: 3px 0 0; color: var(--suave); font-size: 15px; }
.fila-mod .num { font: 500 14px var(--dato); color: var(--suave); }
.fila-mod .precio { font: 500 19px var(--dato); }
.packs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 24px; }
.pack { padding: 24px 20px; background: var(--pizarra); border-top: 4px solid var(--linea); display: grid; gap: 10px; align-content: start; }
.pack.dest { border-top-color: var(--acento); background: var(--placa); }
.pack h3 { font: 800 32px/1 var(--display); text-transform: uppercase; }
.pack .p { font: 500 27px var(--dato); }
.pack s { color: var(--suave); font: 400 14px var(--dato); }
.pack p { margin: 0; color: var(--suave); font-size: 15px; }

.campus { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 44px; align-items: start; }
.lateral { position: sticky; top: 90px; display: grid; gap: 12px; max-height: calc(100vh - 110px); overflow: auto; padding-right: 4px; }
.pila { display: flex; flex-direction: column-reverse; gap: 2px; padding: 8px; background: var(--pizarra); border: 1px solid var(--linea); }
.pila i { display: block; height: 7px; background: var(--placa); }
.pila i.ok { background: linear-gradient(90deg, var(--acento2), var(--acento)); }
.nota-pila { margin: 0; font: 400 13px/1.4 var(--dato); color: var(--suave); }
.lecciones { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.lecciones button { width: 100%; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; text-align: left; padding: 8px 9px; background: transparent; border: 0; color: var(--suave); cursor: pointer; line-height: 1.3; font-size: 15px; }
.lecciones button:hover { background: var(--pizarra); color: var(--texto); }
.lecciones button[aria-current="true"] { background: var(--placa); color: var(--texto); box-shadow: inset 3px 0 0 var(--acento); }
.lecciones .n { font: 500 13px/1.5 var(--dato); }
.lecciones .hecha .n { color: var(--acento); }

article.leccion { max-width: 780px; min-width: 0; }
article.leccion h2 { font: 800 clamp(40px, 6.2vw, 66px)/.98 var(--display); text-transform: uppercase; margin: 6px 0 22px; }
article.leccion h3 { font: 700 22px/1.25 var(--cuerpo); margin: 0 0 10px; }
article.leccion p, article.leccion li { color: var(--texto); }
.bloque { margin-top: 30px; }
article.leccion ol { list-style: none; counter-reset: paso; padding: 0; display: grid; gap: 10px; }
article.leccion ol li { counter-increment: paso; position: relative; padding-left: 46px; min-height: 32px; }
article.leccion ol li::before { content: counter(paso); position: absolute; left: 0; top: 0; width: 32px; height: 32px; display: grid; place-items: center; font: 500 14px var(--dato); background: var(--acento); color: var(--sobre); }
article.leccion ul { padding-left: 22px; display: grid; gap: 7px; }
article.leccion ul li::marker { color: var(--acento); }
article.leccion ul.control { list-style: none; padding-left: 0; }
article.leccion ul.control li { padding-left: 28px; position: relative; }
article.leccion ul.control li::before { content: ""; position: absolute; left: 0; top: 5px; width: 15px; height: 15px; border: 1.5px solid var(--acento); }
.tabla { overflow-x: auto; margin: 16px 0; border: 1px solid var(--linea); background: var(--pizarra); }
table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
th { text-align: left; background: var(--placa); padding: 10px 12px; white-space: nowrap; }
td { padding: 9px 12px; border-top: 1px solid var(--linea); vertical-align: top; min-width: 96px; }
.nota { margin: 18px 0; padding: 12px 15px; background: var(--pizarra); border-left: 4px solid var(--suave); }
.nota b { display: block; font: 500 12px var(--dato); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 3px; }
.nota p { margin: 0; }
.nS { border-color: var(--rojo); } .nS b { color: var(--rojo); }
.nT { border-color: var(--acento); } .nT b { color: var(--acento); }
.nF { border-color: var(--azul); } .nF b { color: var(--azul); }
.diagrama { display: block; width: 100%; margin: 18px 0; background: #fff; }
.video { display: block; margin: 0 0 24px; }
.video video { display: block; width: 100%; max-height: 70vh; background: #000; }
.video.enlace { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: center; padding: 13px 15px; background: var(--placa); text-decoration: none; color: var(--texto); }
.video.enlace:hover { outline: 2px solid var(--acento); }
.video strong { display: block; line-height: 1.3; }
.video small { color: var(--acento); font: 500 13px var(--dato); }
.play { width: 46px; height: 46px; border-radius: 50%; background: var(--acento); position: relative; }
.play::after { content: ""; position: absolute; left: 18px; top: 13px; border-left: 15px solid var(--sobre); border-block: 10px solid transparent; }
.navega { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--linea); }

/* Formato propio de cada modulo */
/* M1 Laboratorio: papel milimetrado y fichas de datos */
[data-mod="m1"] .vista { background-image: linear-gradient(rgba(53, 224, 232, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(53, 224, 232, .06) 1px, transparent 1px); background-size: 24px 24px; max-width: none; }
[data-mod="m1"] .vista > .campus { max-width: 1148px; margin-inline: auto; }
[data-mod="m1"] article.leccion ol li::before { content: counter(paso, decimal-leading-zero); background: transparent; color: var(--acento); border: 1px solid var(--acento); }
[data-mod="m1"] .tabla { border-width: 2px 1px 1px; border-top-color: var(--acento); }
[data-mod="m1"] .nota { border-left-style: double; border-left-width: 6px; }
/* M2 Joyero: tarjetas de pieza y numeros tallados como gema */
[data-mod="m2"] .bloque { padding: 20px; background: var(--pizarra); box-shadow: 0 0 0 1px var(--linea), 6px 6px 0 var(--placa); clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 16px, 100% calc(100% - 16px), calc(100% - 16px) 100%, 16px 100%, 0 calc(100% - 16px), 0 16px); }
[data-mod="m2"] .bloque h3 { color: var(--acento2); }
[data-mod="m2"] article.leccion ol li::before { clip-path: polygon(50% 0, 100% 28%, 100% 72%, 50% 100%, 0 72%, 0 28%); background: linear-gradient(135deg, var(--acento), var(--acento2)); }
[data-mod="m2"] .diagrama, [data-mod="m2"] .video.enlace { clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
/* M3 Galeria: cada proyecto se presenta como obra con marco */
[data-mod="m3"] .bloque { padding: 22px 20px; border: 1px solid var(--acento); outline: 1px solid var(--linea); outline-offset: 5px; margin-inline: 6px; }
[data-mod="m3"] .bloque h3 { font: 800 30px/1 var(--display); text-transform: uppercase; color: var(--acento); }
[data-mod="m3"] article.leccion ol li::before { border-radius: 50%; }
/* M4 Bitacora: linea de tiempo de taller */
[data-mod="m4"] article.leccion ol { gap: 0; }
[data-mod="m4"] article.leccion ol li { padding-bottom: 16px; }
[data-mod="m4"] article.leccion ol li::after { content: ""; position: absolute; left: 15px; top: 32px; bottom: 0; width: 2px; background: var(--acento2); }
[data-mod="m4"] article.leccion ol li:last-child::after { display: none; }
[data-mod="m4"] .bloque { padding-left: 16px; border-left: 6px solid var(--acento2); }
[data-mod="m4"] td:first-child { font-family: var(--dato); color: var(--acento); }
/* M5 Obra: superficie clara, tarjetas de marmol y etapas por capas */
[data-mod="m5"] .bloque { padding: 20px; background: var(--pizarra); box-shadow: 0 2px 16px rgba(19, 26, 36, .1); }
[data-mod="m5"] article.leccion ol li::before { width: 32px; background: var(--texto); color: var(--fondo); }
[data-mod="m5"] article.leccion ol li:nth-child(2n)::before { background: var(--acento); }
[data-mod="m5"] .banda .titulo, [data-mod="m5"] .banda .bajada { color: #131a24; }
/* M6 Libreta: planilla contable con renglones y totales */
[data-mod="m6"] article.leccion .tabla { border-style: dashed; }
[data-mod="m6"] table { font-family: var(--dato); font-size: 14px; }
[data-mod="m6"] td { border-top-style: dashed; }
[data-mod="m6"] td:last-child { text-align: right; color: var(--acento2); }
[data-mod="m6"] th:last-child { text-align: right; }
[data-mod="m6"] .bloque { background-image: repeating-linear-gradient(transparent 0 31px, rgba(79, 224, 143, .08) 31px 32px); }
[data-mod="m6"] article.leccion ol li::before { background: transparent; color: var(--acento); border-bottom: 2px solid var(--acento); }

.herramientas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 24px; }
.panel { background: var(--pizarra); padding: 22px 20px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel.doble { grid-column: 1 / -1; }
.panel h3 { font: 800 32px/1 var(--display); text-transform: uppercase; }
.panel > p { margin: 0; color: var(--suave); font-size: 15px; }
.campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
label { display: grid; gap: 4px; font-size: 14px; color: var(--suave); }
[hidden] { display: none !important; }
input[type="number"], input[type="email"], input[type="text"] { width: 100%; min-height: 44px; padding: 8px 10px; background: var(--fondo); border: 1px solid var(--linea); color: var(--texto); font-family: var(--dato); }
.resultado { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.resultado div { border-top: 2px solid var(--acento); padding-top: 7px; }
.resultado b { display: block; font: 500 22px var(--dato); }
.resultado span { font-size: 13px; color: var(--suave); }
.aviso { padding: 10px 13px; background: var(--placa); border-left: 3px solid var(--acento); font-size: 15px; }
.aviso.mal { border-color: var(--rojo); }
.reloj { font: 500 clamp(52px, 10vw, 76px)/1 var(--dato); font-variant-numeric: tabular-nums; color: var(--acento2); }
.reloj.fin { color: var(--rojo); }
.agenda { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.agenda li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--linea); padding-bottom: 6px; font-size: 15px; }
.agenda b { font: 500 14px var(--dato); text-align: right; }
.hitos { list-style: none; margin: 26px 0 0; padding: 0; display: grid; border-left: 2px solid var(--acento); }
.hitos li { padding: 0 0 26px 22px; position: relative; max-width: 42em; }
.hitos li::before { content: ""; position: absolute; left: -7px; top: 8px; width: 12px; height: 12px; background: var(--acento); }
.hitos b { display: block; font: 800 36px/1 var(--display); }
.hitos p { margin: 5px 0 0; color: var(--suave); }
.estado { padding: 12px 16px; background: #f5a623; color: #16100a; font-weight: 600; text-align: center; }
.estado.error { background: #b3372b; color: #fff; }
.muro { display: grid; gap: 14px; max-width: 560px; margin-top: 16px; padding: 24px 20px; background: var(--placa); }
article.leccion .muro h3, .muro h3 { font: 800 34px/1 var(--display); text-transform: uppercase; margin: 0; }
article.leccion .muro p, .muro p { margin: 0; color: var(--suave); }
.muro .precio-muro { font: 500 30px var(--dato); color: var(--texto); }
.muro form { display: grid; gap: 10px; }
.muro summary { cursor: pointer; color: var(--texto); }
.muro details form { margin-top: 12px; }
article.leccion .muro .mensaje, .mensaje { min-height: 1.4em; color: var(--rojo); font-size: 15px; }
.lateral .boton { font-size: 15px; min-height: 42px; }
.prevista { font-size: 14px; color: #aab6c7; padding-block: 18px 26px; }
@media (max-width: 880px) {
  .campus { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .lateral { position: static; max-height: none; }
  .tres, .packs, .herramientas, .mosaico { grid-template-columns: minmax(0, 1fr); }
  .tesela { min-height: 210px; }
  .ficha { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  .velo { background: linear-gradient(90deg, rgba(var(--velo), .9), rgba(var(--velo), .55)); }
}

<script>

const FRAG = `#extension GL_OES_standard_derivatives : enable
precision highp float;
uniform vec2 R, M; uniform float T, ESC, BAN, ANI, RIO, GLI; uniform vec3 A, B, C, D;

function crearGL(lienzo) {

const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
let vivo = null;
function animar(banda) {
  if (vivo) { cancelAnimationFrame(vivo.raf); vivo = null; }
  const lienzo = banda && banda.querySelector("canvas");
  if (!lienzo) return;
  const m = crearGL(lienzo);
  if (!m) { lienzo.hidden = true; return; }
  const arte = ARTE[banda.dataset.arte];
  const estado = { raf: 0, mx: -2, my: -2, gx: -2, gy: -2 };
  vivo = estado;
  const medir = () => { const e = Math.min(devicePixelRatio || 1, 1.25) * .7; lienzo.width = Math.max(lienzo.clientWidth * e, 2); lienzo.height = Math.max(lienzo.clientHeight * e, 2); };
  medir();
  banda.addEventListener("pointermove", (ev) => { const r = banda.getBoundingClientRect(); estado.gx = (ev.clientX - r.left) / r.width; estado.gy = 1 - (ev.clientY - r.top) / r.height; });
  banda.addEventListener("pointerleave", () => { estado.gx = -2; estado.gy = -2; });
  let ultimo = 0;
  const cuadro = (ms) => {
    if (vivo !== estado || !lienzo.isConnected) return;
    if (ms - ultimo > 33 && !document.hidden) {
      ultimo = ms;
      if (lienzo.clientWidth * .7 > lienzo.width + 40) medir();
      estado.mx += (estado.gx - estado.mx) * .12; estado.my += (estado.gy - estado.my) * .12;
      dibujar(m, arte, 18 + ms / 1000, estado.mx, estado.my);
    }
    estado.raf = requestAnimationFrame(cuadro);
  };
  dibujar(m, arte, 18, -2, -2);
  if (!quieto) estado.raf = requestAnimationFrame(cuadro);
}

  const litros = area * espesor;
  const kg = litros * LITROS_KG;
  const modulos = [1.5, 3, 6, 30].map((peso) => ({ peso, mm: area > 0 ? peso / LITROS_KG / area : 0 }));
  const apto = modulos.filter((m) => m.mm >= 1 && m.mm <= 2).pop() || null;
  return { area, manos, litros, kg, modulos, apto, espera: Math.max(manos - 1, 0) * 8 };
}
function calcularPrecio(c) {
  const costo = (c.materiales + c.horas * c.valor) * (1 + c.gastos / 100);
  const divisor = 1 - c.ganancia / 100 - c.cobro / 100;
  return { costo, precio: divisor > 0 ? costo / divisor : 0, minimo: c.cobro < 100 ? costo / (1 - c.cobro / 100) : 0 };
}

function pintarManos() {
  const v = (id) => Math.max(Number(document.getElementById(id).value) || 0, 0);
  const r = calcularManos(v("c-largo"), v("c-ancho"), v("c-esp"));
  document.getElementById("c-res").innerHTML = [
    [r.area.toFixed(2).replace(".", ",") + " m²", "Superficie"], [r.litros.toFixed(2).replace(".", ",") + " L", "Volumen"],
    [r.kg.toFixed(2).replace(".", ",") + " kg", "Mezcla sin desperdicio"], [String(r.manos), "Manos de hasta 2 mm"],
    [r.espera + " h", "Espera mínima entre manos"],
  ].map(([a, b]) => `<div><b>${a}</b><span>${b}</span></div>`).join("");
  const aviso = document.getElementById("c-aviso");
  const pasaColada = v("c-esp") >= 20;
  aviso.className = "aviso" + (pasaColada || !r.apto ? " mal" : "");
  if (pasaColada) aviso.textContent = "Con 2 cm o más, usá un producto de colada gruesa. Consultanos antes de comprar.";
  else if (r.apto) aviso.textContent = `El módulo de ${String(r.apto.peso).replace(".", ",")} kg completa una mano de ${r.apto.mm.toFixed(2).replace(".", ",")} mm. Dentro del rango de 1 a 2 mm.`;
  else aviso.textContent = "Ningún módulo completo queda entre 1 y 2 mm en esta superficie. Consultanos la relación de A y B antes de fraccionar.";
}
function pintarPrecio() {
  const v = (id) => Math.max(Number(document.getElementById(id).value) || 0, 0);
  const r = calcularPrecio({ materiales: v("p-mat"), horas: v("p-hs"), valor: v("p-val"), gastos: v("p-gas"), ganancia: v("p-gan"), cobro: v("p-cob") });
  document.getElementById("p-res").innerHTML = [[ARS(r.costo), "Costo total"], [ARS(r.minimo), "Precio mínimo"], [ARS(r.precio), "Precio sugerido"]]
    .map(([a, b]) => `<div><b>${a}</b><span>${b}</span></div>`).join("");
}
let inicioReloj = leer("epolax-reloj", null);
let tic = null;
const fechaHora = (ms) => new Date(ms).toLocaleString("es-AR", { weekday: "short", hour: "2-digit", minute: "2-digit" });
function pintarReloj() {
  const t = document.getElementById("r-t");
  if (!t) { clearInterval(tic); tic = null; return; }
  const base = inicioReloj ?? Date.now();
  const resta = 1200000 - (Date.now() - base);
  const seg = Math.max(Math.ceil(resta / 1000), 0);
  t.textContent = inicioReloj ? `${String(Math.floor(seg / 60)).padStart(2, "0")}:${String(seg % 60).padStart(2, "0")}` : "20:00";
  t.classList.toggle("fin", Boolean(inicioReloj) && seg === 0);
  document.getElementById("r-ag").innerHTML = [["Secado duro en 1 mm", base + 288e5], ["Última mano sin lijar", base + 864e5], ["Máxima resistencia", base + 3456e5]]
    .map(([a, b]) => `<li><span>${a}</span><b>${fechaHora(b)}</b></li>`).join("");
}
function iniciarHerramientas() {
  ["c-largo", "c-ancho", "c-esp"].forEach((id) => document.getElementById(id).addEventListener("input", pintarManos));
  ["p-mat", "p-hs", "p-val", "p-gas", "p-gan", "p-cob"].forEach((id) => document.getElementById(id).addEventListener("input", pintarPrecio));
  document.getElementById("r-go").addEventListener("click", () => { inicioReloj = Date.now(); guardar("epolax-reloj", inicioReloj); pintarReloj(); });
  document.getElementById("r-rst").addEventListener("click", () => { inicioReloj = null; guardar("epolax-reloj", null); pintarReloj(); });
  pintarManos(); pintarPrecio(); pintarReloj();
  clearInterval(tic); tic = setInterval(pintarReloj, 1000);
}

function mostrar(subir = true) {
  const token = (location.hash || "#inicio").slice(1);
  const modulo = DATOS.modulos.some((m) => m.id === token);
  const ruta = modulo ? "modulo" : ["cursos", "mesa", "historia", "comprar"].includes(token) ? token : "inicio";
  if (modulo) app.dataset.mod = token; else app.removeAttribute("data-mod");
  app.innerHTML = { inicio: vistaInicio, cursos: vistaCursos, mesa: vistaMesa, historia: vistaHistoria, comprar: vistaComprar, modulo: () => vistaModulo(token) }[ruta]();
  document.querySelectorAll("[data-nav]").forEach((a) => {
    const activo = a.dataset.nav === ruta || (ruta === "modulo" && a.dataset.nav === "cursos");
    if (activo) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  if (ruta === "mesa") iniciarHerramientas();
  animar(app.querySelector(".banda"));
  pintarTexturas();
  if (subir) window.scrollTo(0, 0);
}
app.addEventListener("click", (e) => {
  const token = location.hash.slice(1);
  const b = e.target.closest("button");
  if (!b || !DATOS.modulos.some((m) => m.id === token)) return;
  const m = DATOS.modulos.find((x) => x.id === token);
  if (b.dataset.l !== undefined) leccionActual[token] = Number(b.dataset.l);
  else if (b.dataset.paso) leccionActual[token] = Math.min(Math.max((leccionActual[token] ?? 0) + Number(b.dataset.paso), 0), m.lecciones.length - 1);
  else if (b.dataset.hecha !== undefined) {
    const n = Number(b.dataset.hecha); const lista = hechas[token] || [];
    hechas[token] = lista.includes(n) ? lista.filter((x) => x !== n) : [...lista, n];
    guardar(clave, hechas); mostrar(false); return;
  } else return;
  mostrar();
  if (innerWidth <= 880) document.querySelector("article.leccion").scrollIntoView();
});
window.addEventListener("hashchange", () => mostrar());

function avisar(texto, error = false) {
  const a = document.getElementById("estado-pago");
  a.textContent = texto; a.hidden = !texto; a.classList.toggle("error", error);
}
function aplicarAcceso(r) {
  r.modulos.forEach((m) => {
    const destino = DATOS.modulos.find((x) => x.id === m.id);
    m.lecciones.forEach((html, i) => { destino.lecciones[i].html = html; });
  });
  conAcceso = true;
  document.getElementById("nav-comprar").hidden = true;
}
const pedirAcceso = async (cuerpo) => {
  const r = await fetch("/api/acceso", cuerpo ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(cuerpo) } : undefined);
  if (r.status === 503) throw new Error("temporal");
  return r.json();
};
function resolverPago(r) {
  if (r.acceso) {
    aplicarAcceso(r);
    avisar("Pago aprobado. Ya podés entrar a todo el curso.");
    history.replaceState(null, "", location.pathname + "#m1");
    mostrar();
  } else if (r.estado === "pendiente") {
    avisar("Tu pago está en revisión. Cuando se apruebe, entrá con «Ya pagué y no veo el curso».");
  } else {
    avisar("No pudimos confirmar el pago. Si te lo cobraron, escribinos por WhatsApp al 11 3133-6580.", true);
  }
}
async function iniciarVenta() {
  document.getElementById("nav-comprar").hidden = false;
  const q = new URLSearchParams(location.search);
  const pago = q.get("payment_id") || q.get("collection_id") || q.get("order_id");
  try {
    if (q.get("pago") === "rechazado") {
      avisar("El pago no se aprobó. Podés intentarlo de nuevo con otro medio.", true);
      history.replaceState(null, "", location.pathname + "#comprar");
      mostrar();
    } else if (pago && pago !== "null") {
      resolverPago(await pedirAcceso({ pago, ref: q.get("external_reference") }));
    } else {
      const r = await pedirAcceso();
      if (r.acceso) { aplicarAcceso(r); mostrar(false); }
    }
  } catch (e) {
    avisar("No pudimos verificar tu acceso. Recargá la página en unos minutos.", true);
  }
}
app.addEventListener("submit", async (e) => {
  e.preventDefault();
  const msj = document.getElementById("m-msj");
  const boton = e.target.querySelector("button");
  msj.textContent = "";
  boton.disabled = true;
  try {
    if (e.target.id === "f-pago") {
      const email = document.getElementById("m-email").value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msj.textContent = "Escribí un email válido: ahí te llega el comprobante."; return; }
      const r = await fetch("/api/pago", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email }) });
      const d = await r.json();
      if (!r.ok || !d.url) { msj.textContent = "No pudimos abrir Mercado Pago. Probá de nuevo en unos minutos."; return; }
      location.href = d.url;
    } else if (e.target.id === "f-recup") {
      const r = await pedirAcceso({ operacion: document.getElementById("r-op").value.trim(), email: document.getElementById("r-email").value.trim() });
      if (r.acceso) resolverPago(r);
      else msj.textContent = r.estado === "pendiente" ? "Tu pago sigue en revisión." : "No encontramos un pago aprobado con esos datos. Revisá el número y el email.";
    }
  } catch (err) {
    msj.textContent = "No pudimos conectarnos. Probá de nuevo en unos minutos.";
  } finally {
    boton.disabled = false;
  }
});
mostrar(false);
if (VENTA) iniciarVenta();
